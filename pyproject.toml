[project]
name = "tailshare"
version = "0.1.0"
description = "Discord から使う、仲間内のファイル共有 Bot(Tailscale Funnel で公開)"
requires-python = ">=3.11"
dependencies = ["discord.py>=2.4.0"]

[tool.ruff]
line-length = 130
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.ruff.lint.per-file-ignores]
# HTML と SVG を埋め込んでいるため
"tailshare/web.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
